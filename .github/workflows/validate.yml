name: Validate Astro Worker

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read Flutter version
        id: sdk
        shell: bash
        run: printf 'version=%s\n' "$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          cache: true
      - run: scripts/check.sh
      - run: flutter test --platform chrome test/astronomy_test.dart
      - run: python3 scripts/check_dependencies.py
      - run: python3 scripts/sync_branding.py --check
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            runner: ubuntu-latest
            command: flutter build apk --debug
          - target: web
            runner: ubuntu-latest
            command: scripts/build_web.sh
          - target: ios
            runner: macos-latest
            command: flutter build ios --simulator --no-codesign
          - target: macos
            runner: macos-latest
            command: flutter build macos --debug
          - target: windows
            runner: windows-latest
            command: flutter build windows --debug
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - name: Read Flutter version
        id: sdk
        shell: bash
        run: printf 'version=%s\n' "$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: ${{ matrix.command }}
      - if: matrix.target == 'macos'
        run: flutter test integration_test -d macos
